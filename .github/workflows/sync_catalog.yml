name: Sync Catalog to Cloudflare D1

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:      # Manual trigger button in GitHub UI

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend_revised/package-lock.json

      - name: Install Cloudflare Worker dependencies
        run: |
          cd backend_revised && npm ci

      - name: Generate D1 Lane Sync SQL
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: |
          python backend_revised/scripts/sync_catalog_to_d1.py --output backend_revised/sync_catalog.sql

      - name: Execute Sync on Cloudflare D1
        working-directory: backend_revised
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute movies-catalog --remote --file=sync_catalog.sql
