name: Sync Catalog to Cloudflare D1

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:      # Manual trigger button in GitHub UI

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend_revised/package-lock.json

      - name: Install Cloudflare Worker dependencies
        working-directory: backend_revised
        run: npm ci

      - name: Generate D1 Lane Sync SQL
        working-directory: backend_revised
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run sync -- --output sync_catalog.sql

      - name: Execute Sync on Cloudflare D1
        working-directory: backend_revised
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute movies-catalog --remote --file=sync_catalog.sql --yes
