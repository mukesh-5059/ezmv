name: Sync Catalog & Publish CDN

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:      # Manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Catalog Cache
        uses: actions/cache@v4
        with:
          path: catalog
          key: catalog-json-${{ github.run_id }}
          restore-keys: |
            catalog-json-

      - name: Restore IMDb Ratings Baseline
        uses: actions/cache@v4
        with:
          path: .cache/imdb
          key: imdb-ratings-baseline-${{ github.run_id }}
          restore-keys: |
            imdb-ratings-baseline-

      - name: Sync IMDb Ratings Diff to Database
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python backend_revised/scripts/sync_ratings_diff.py

      - name: Run IMDb sync, metadata enrichment & JSON exporter
        env:
          ReadAccessToken: ${{ secrets.READ_ACCESS_TOKEN || secrets.TMDB_READ_ACCESS_TOKEN || secrets.READACCESSTOKEN }}
          ApiKey: ${{ secrets.TMDB_API_KEY || secrets.APIKEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python backend/scripts/sync_catalog.py --export-dir catalog

      - name: Deploy catalog JSONs to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./catalog
          destination_dir: catalog
